[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
    --color=yes
markers =
    smoke: critical path tests, run on every PR
    regression: full regression, run nightly
    ui: Playwright UI tests
    api: REST API tests
    mocked: tests that use network mocking